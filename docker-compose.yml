# Geliştirme veritabanı: `docker compose up -d`
services:
  postgres:
    image: postgres:17
    container_name: pdks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdks
      POSTGRES_USER: pdks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdks_dev_password}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pdks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdks -d pdks"]
      interval: 5s
      retries: 10

volumes:
  pdks-pgdata:
